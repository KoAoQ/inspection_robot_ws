x10:
  lslidar_driver_node:
    ros__parameters:
      lidar_type: "X10"
      lidar_model: "M10P"

      serial_port: "/dev/wheeltec_lidar"

      frame_id: "laser_link"
      laserscan_topic: "/scan"
      pointcloud_topic: "/lidar/points"

      publish_scan: true
      publish_multiecholaserscan: false

      min_range: 0.15
      max_range: 50.0

      use_time_service: false
      use_first_point_time: false
      use_high_precision: false
      enable_noise_filter: false

      angle_disable_min: [7300,11300, 15300,24200, 27100]
      angle_disable_max: [8700,11700, 20500,24500, 28600]

      is_pretreatment: false
      x_offset: 0.0
      y_offset: 0.0
      z_offset: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0