amcl:
  ros__parameters:
    use_sim_time: false

    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_footprint"
    scan_topic: "/scan"

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"

    min_particles: 500
    max_particles: 2000
    max_beams: 60

    update_min_d: 0.05
    update_min_a: 0.05

    tf_broadcast: true
    transform_tolerance: 0.5