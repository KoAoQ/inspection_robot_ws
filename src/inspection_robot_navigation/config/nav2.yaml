# Nav2 全量中文注释配置。
# 本文件用于阅读、评审和调参；正式启动默认仍使用 nav2.yaml。
# 数组顺序通常为 [x 线速度, y 线速度, z 角速度]。

global_costmap:  # 全局代价地图配置，用于全局路径规划。
  global_costmap:  # 全局代价地图配置，用于全局路径规划。
    ros__parameters:  # 该 ROS 2 节点的参数集合。
      use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

      global_frame: map  # 本模块使用的全局参考坐标系。
      robot_base_frame: base_footprint  # 机器人底盘参考坐标系。
      transform_tolerance: 0.30  # 允许使用的 TF 变换最大时间容差，单位秒。

      update_frequency: 2.0  # 内部代价地图更新频率，单位 Hz。
      publish_frequency: 1.0  # 代价地图对外发布频率，单位 Hz。
      resolution: 0.05  # 每个代价地图栅格代表的实际尺寸，单位米。

      rolling_window: false  # 是否让代价地图窗口跟随机器人移动。
      track_unknown_space: true  # 是否在地图中区分未知区域。
      always_send_full_costmap: true  # 是否每次发布完整代价地图。

      footprint: "[[-0.320, -0.325], [-0.320, 0.325], [0.330, 0.325], [0.330, -0.325]]"  # 底盘二维碰撞外形，各点相对 base_footprint，单位米。
      footprint_padding: 0.02  # 在底盘外形之外增加的碰撞安全余量，单位米。

      plugins:  # 该模块按顺序加载的插件列表。
        - static_layer  # 加载静态地图层。
        - obstacle_layer  # 加载二维激光障碍层。
        - inflation_layer  # 加载障碍物膨胀层。

      static_layer:  # Nav2 参数或配置节点 `static_layer`。
        plugin: "nav2_costmap_2d::StaticLayer"  # 当前功能块使用的 ROS 2 插件实现。
        map_subscribe_transient_local: true  # 使用持久化 QoS 接收最后一次发布的静态地图。

      obstacle_layer:  # Nav2 参数或配置节点 `obstacle_layer`。
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 当前功能块使用的 ROS 2 插件实现。
        enabled: true  # 是否启用当前功能或评价项。
        observation_sources: scan  # 用于建立或清除障碍物的传感器源列表。

        scan:  # 二维激光雷达数据源配置。
          topic: /scan  # 订阅或发布的 ROS 2 话题名称。
          data_type: LaserScan  # 传感器消息类型。
          clearing: true  # 是否使用该传感器射线清除空闲区域。
          marking: true  # 是否使用该传感器标记障碍物。
          inf_is_valid: true  # 是否把激光正无穷距离视为有效无障碍测量。

          obstacle_min_range: 0.15  # 参与障碍物标记的最小距离，单位米。
          obstacle_max_range: 8.0  # 参与障碍物标记的最大距离，单位米。
          raytrace_min_range: 0.15  # 射线清障使用的最小距离，单位米。
          raytrace_max_range: 10.0  # 射线清障使用的最大距离，单位米。

          min_obstacle_height: 0.0  # 点云障碍物的最小高度，单位米。
          max_obstacle_height: 2.0  # 点云障碍物的最大高度，单位米。

      inflation_layer:  # Nav2 参数或配置节点 `inflation_layer`。
        plugin: "nav2_costmap_2d::InflationLayer"  # 当前功能块使用的 ROS 2 插件实现。
        inflation_radius: 0.55  # 障碍物向外膨胀的半径，单位米。
        cost_scaling_factor: 3.0  # 膨胀层代价随距离衰减的系数。


local_costmap:  # 局部滚动代价地图配置，用于实时避障。
  local_costmap:  # 局部滚动代价地图配置，用于实时避障。
    ros__parameters:  # 该 ROS 2 节点的参数集合。
      use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

      global_frame: odom  # 本模块使用的全局参考坐标系。
      robot_base_frame: base_footprint  # 机器人底盘参考坐标系。
      transform_tolerance: 0.30  # 允许使用的 TF 变换最大时间容差，单位秒。

      update_frequency: 8.0  # 内部代价地图更新频率，单位 Hz。
      publish_frequency: 4.0  # 代价地图对外发布频率，单位 Hz。
      resolution: 0.05  # 每个代价地图栅格代表的实际尺寸，单位米。

      rolling_window: true  # 是否让代价地图窗口跟随机器人移动。
      width: 4  # 局部代价地图宽度，单位米。
      height: 4  # 局部代价地图高度，单位米。
      always_send_full_costmap: true  # 是否每次发布完整代价地图。

      footprint: "[[-0.320, -0.325], [-0.320, 0.325], [0.330, 0.325], [0.330, -0.325]]"  # 底盘二维碰撞外形，各点相对 base_footprint，单位米。
      footprint_padding: 0.02  # 在底盘外形之外增加的碰撞安全余量，单位米。

      plugins:  # 该模块按顺序加载的插件列表。
        - obstacle_layer  # 加载二维激光障碍层。
        - voxel_layer  # 加载深度点云三维体素层。
        - inflation_layer  # 加载障碍物膨胀层。

      obstacle_layer:  # Nav2 参数或配置节点 `obstacle_layer`。
        plugin: "nav2_costmap_2d::ObstacleLayer"  # 当前功能块使用的 ROS 2 插件实现。
        enabled: true  # 是否启用当前功能或评价项。
        observation_sources: scan  # 用于建立或清除障碍物的传感器源列表。

        scan:  # 二维激光雷达数据源配置。
          topic: /scan  # 订阅或发布的 ROS 2 话题名称。
          data_type: LaserScan  # 传感器消息类型。
          clearing: true  # 是否使用该传感器射线清除空闲区域。
          marking: true  # 是否使用该传感器标记障碍物。
          inf_is_valid: true  # 是否把激光正无穷距离视为有效无障碍测量。

          obstacle_min_range: 0.15  # 参与障碍物标记的最小距离，单位米。
          obstacle_max_range: 3.0  # 参与障碍物标记的最大距离，单位米。
          raytrace_min_range: 0.15  # 射线清障使用的最小距离，单位米。
          raytrace_max_range: 3.5  # 射线清障使用的最大距离，单位米。

          min_obstacle_height: 0.0  # 点云障碍物的最小高度，单位米。
          max_obstacle_height: 2.0  # 点云障碍物的最大高度，单位米。

      voxel_layer:  # Nav2 参数或配置节点 `voxel_layer`。
        plugin: "nav2_costmap_2d::VoxelLayer"  # 当前功能块使用的 ROS 2 插件实现。
        enabled: true  # 是否启用当前功能或评价项。

        publish_voxel_map: true  # 是否发布三维体素调试地图。
        origin_z: 0.0  # 体素地图最低高度，单位米。
        z_resolution: 0.10  # 体素地图垂直分辨率，单位米。
        z_voxels: 16  # 体素地图垂直方向的栅格层数。
        mark_threshold: 0  # 同一列达到多少占用体素后标记二维障碍。

        observation_sources: depth_cloud  # 用于建立或清除障碍物的传感器源列表。

        depth_cloud:  # 深度相机过滤点云数据源配置。
          topic: /camera/depth/points_filtered  # 订阅或发布的 ROS 2 话题名称。
          data_type: PointCloud2  # 传感器消息类型。
          clearing: true  # 是否使用该传感器射线清除空闲区域。
          marking: true  # 是否使用该传感器标记障碍物。

          min_obstacle_height: 0.03  # 点云障碍物的最小高度，单位米。
          max_obstacle_height: 1.60  # 点云障碍物的最大高度，单位米。

          obstacle_min_range: 0.10  # 参与障碍物标记的最小距离，单位米。
          obstacle_max_range: 3.0  # 参与障碍物标记的最大距离，单位米。
          raytrace_min_range: 0.10  # 射线清障使用的最小距离，单位米。
          raytrace_max_range: 3.2  # 射线清障使用的最大距离，单位米。

      inflation_layer:  # Nav2 参数或配置节点 `inflation_layer`。
        plugin: "nav2_costmap_2d::InflationLayer"  # 当前功能块使用的 ROS 2 插件实现。
        inflation_radius: 0.55  # 障碍物向外膨胀的半径，单位米。
        cost_scaling_factor: 3.0  # 膨胀层代价随距离衰减的系数。
planner_server:  # 全局规划服务器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    expected_planner_frequency: 2.0  # 期望全局规划器至少达到的频率，单位 Hz。
    planner_plugins:  # 全局规划器插件名称列表。
      - Lattice  # 启用 Smac Lattice 全局规划器。

    Lattice:  # Smac Lattice 全局规划器的参数命名空间。
      plugin: "nav2_smac_planner/SmacPlannerLattice"  # 当前功能块使用的 ROS 2 插件实现。

      # Humble自带的差速/滑移转向运动原语：
      # 5cm栅格分辨率、0.5m最小行驶转弯半径；仍包含原地旋转原语。
      lattice_filepath: "/opt/ros/humble/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"  # 运动原语文件；决定前进圆弧半径和可用原地旋转动作。

      tolerance: 0.25  # 无法精确到达时允许规划到目标附近的距离，单位米。
      allow_unknown: true  # 是否允许全局路径经过未知栅格。

      max_iterations: 100000  # 一次全局搜索允许的最大迭代次数。
      max_on_approach_iterations: 1000  # 进入目标附近后允许继续搜索的迭代次数。
      max_planning_time: 2.0  # 一次全局规划允许的最长计算时间，单位秒。

      cache_obstacle_heuristic: true  # 是否缓存障碍启发式结果以加快重复规划。
      lookup_table_size: 20.0  # 运动学启发式查找表覆盖范围，单位米。

      reverse_penalty: 2.0  # 倒车轨迹代价倍率；当前禁止倒车时基本不生效。
      change_penalty: 0.05  # 切换运动方向或原语类型的额外代价。
      non_straight_penalty: 1.05  # 非直线路径相对直线路径的代价倍率。
      cost_penalty: 2.0  # 代价地图栅格代价对全局路径的影响权重。
      retrospective_penalty: 0.015  # 鼓励搜索优先扩展较后继节点的轻微偏置。
      rotation_penalty: 1.5  # 原地旋转原语的代价；越大越倾向使用圆弧。

      analytic_expansion_ratio: 3.5  # 尝试解析连接目标的频率比例。
      analytic_expansion_max_length: 3.0  # 解析扩展允许的最大长度，单位米。

      # 后向安全链完成前，暂不生成倒车路径。
      allow_reverse_expansion: false  # 是否生成倒车方向的运动原语扩展。

      smooth_path: true  # 是否对规划出的全局路径执行内部平滑。
controller_server:  # 局部控制器服务器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    # 与MPPI的model_dt=0.10对应，匹配ARM平台可稳定达到的控制频率。
    controller_frequency: 10.0  # 局部控制器计算速度指令的频率，单位 Hz。

    min_x_velocity_threshold: 0.001  # 小于该值的里程计前向速度按零处理。
    min_y_velocity_threshold: 0.001  # 小于该值的横向速度按零处理。
    min_theta_velocity_threshold: 0.001  # 小于该值的角速度按零处理。
    failure_tolerance: 0.30  # 控制器短时计算失败仍可容忍的持续时间，单位秒。

    progress_checker_plugin: progress_checker  # 用于判断机器人是否持续取得进展的插件名称。
    goal_checker_plugins:  # 用于判断是否到达目标的插件列表。
      - general_goal_checker  # 启用位置和航向目标检查器。
    controller_plugins:  # 局部路径跟踪控制器插件列表。
      - FollowPath  # 启用 Rotation Shim 包装的 MPPI 控制器。

    progress_checker:  # 导航进展检查器参数。
      plugin: "nav2_controller::SimpleProgressChecker"  # 当前功能块使用的 ROS 2 插件实现。
      required_movement_radius: 0.10  # 规定时间内必须移动的最小距离，单位米。
      movement_time_allowance: 15.0  # 完成最小移动量允许的时间，单位秒。

    general_goal_checker:  # 通用目标位置与航向检查器参数。
      plugin: "nav2_controller::SimpleGoalChecker"  # 当前功能块使用的 ROS 2 插件实现。
      stateful: true  # 到达位置容差后锁定位置完成状态，只继续检查航向。
      xy_goal_tolerance: 0.20  # 判定到达目标位置的平面距离容差，单位米。
      yaw_goal_tolerance: 0.30  # 判定到达目标朝向的角度容差，单位弧度。

    FollowPath:  # Rotation Shim 与主 MPPI 跟踪控制器的共同命名空间。
      plugin: "nav2_rotation_shim_controller::RotationShimController"  # 当前功能块使用的 ROS 2 插件实现。
      primary_controller: "nav2_mppi_controller::MPPIController"  # Rotation Shim 完成预旋转后使用的主控制器插件。

      # 大角度偏差及终点朝向由Rotation Shim原地调整，避免终点附近绕圈。
      angular_dist_threshold: 0.55  # 路径方向误差超过该值时开始原地预旋转，单位弧度。
      angular_disengage_threshold: 0.25  # 路径方向误差降到该值后退出预旋转，单位弧度。
      forward_sampling_distance: 0.25  # 沿路径向前采样朝向的位置距离，单位米。
      rotate_to_heading_angular_vel: 1.00  # Rotation Shim 原地旋转的最大角速度，单位弧度每秒。
      max_angular_accel: 1.50  # Rotation Shim 允许的最大角加速度，单位弧度每二次方秒。
      simulate_ahead_time: 1.0  # 旋转行为向前碰撞预测的时间，单位秒。
      rotate_to_goal_heading: true  # 到达目标位置后是否原地调整最终朝向。

      motion_model: DiffDrive  # MPPI 使用的底盘运动学模型；差速/滑移底盘使用 DiffDrive。

      # 30 × 0.10 = 3.0秒预测范围，降低ARM平台实时计算负载。
      time_steps: 30  # 每条 MPPI 候选轨迹包含的离散预测步数。
      model_dt: 0.10  # MPPI 每个预测步的时间间隔，单位秒。
      batch_size: 800  # MPPI 每个控制周期采样的候选轨迹数量。
      iteration_count: 1  # 每个控制周期执行的 MPPI 优化迭代次数。

      temperature: 0.40  # MPPI 轨迹加权温度；增大通常更平滑，过大则反应变钝。
      gamma: 0.015  # MPPI 控制能论中的控制代价系数。
      retry_attempt_limit: 1  # 控制优化失败时允许立即重试的次数。

      # 保持仅前进控制；速度上限与底盘驱动配置一致。
      vx_max: 1.20  # MPPI 允许的最大前向线速度，单位米每秒。
      vx_min: 0.0  # MPPI 允许的最小前向线速度；零表示允许停车原地旋转。
      vy_max: 0.0  # 最大横向速度；差速底盘必须为零。
      wz_max: 1.00  # MPPI 允许的最大角速度绝对值，单位弧度每秒。

      vx_std: 0.30  # MPPI 前向速度随机采样的标准差。
      vy_std: 0.0  # MPPI 横向速度随机采样标准差；差速底盘为零。
      wz_std: 0.30  # MPPI 角速度随机采样标准差。

      prune_distance: 1.5  # 从机器人后方裁掉已通过路径的距离，单位米。
      transform_tolerance: 0.20  # 允许使用的 TF 变换最大时间容差，单位秒。

      visualize: false  # 是否发布大量 MPPI 候选轨迹用于调试。

      critics:  # MPPI 用于评价候选轨迹的代价函数列表。
        - ConstraintCritic  # 启用运动约束评价。
        - ObstaclesCritic  # 启用障碍物与碰撞评价。
        - GoalCritic  # 启用目标位置评价。
        - GoalAngleCritic  # 启用目标航向评价。
        - PathAlignCritic  # 启用路径对齐评价。
        - PathFollowCritic  # 启用路径推进评价。
        - PathAngleCritic  # 启用路径角度评价。
        - PreferForwardCritic  # 启用前进偏好评价。

      ConstraintCritic:  # 运动学速度和约束代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 4.0  # 当前 critic 在总轨迹代价中的权重。

      ObstaclesCritic:  # 障碍物距离与碰撞代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        repulsion_weight: 1.5  # 远离障碍物的排斥代价权重。
        critical_weight: 20.0  # 接近碰撞区域时的高风险代价权重。

        # 使用实测矩形footprint进行完整碰撞检查。
        consider_footprint: true  # 碰撞检查是否使用完整矩形 footprint。
        collision_cost: 10000.0  # 预测轨迹发生碰撞时施加的高额代价。
        collision_margin_distance: 0.12  # footprint 外额外保留的碰撞距离，单位米。
        near_goal_distance: 0.40  # 进入该目标距离后调整障碍 critic 行为，单位米。

        # 必须与局部Costmap的膨胀层一致。
        inflation_radius: 0.55  # 障碍物向外膨胀的半径，单位米。
        cost_scaling_factor: 3.0  # 膨胀层代价随距离衰减的系数。

      GoalCritic:  # 接近目标位置时的距离代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 5.0  # 当前 critic 在总轨迹代价中的权重。
        threshold_to_consider: 1.2  # 距目标小于该值时启用或停用对应 critic，单位米。

      GoalAngleCritic:  # 接近目标时的最终航向代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 3.0  # 当前 critic 在总轨迹代价中的权重。
        threshold_to_consider: 0.5  # 距目标小于该值时启用或停用对应 critic，单位米。

      PathAlignCritic:  # 轨迹与全局路径对齐程度代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 7.0  # 当前 critic 在总轨迹代价中的权重。
        max_path_occupancy_ratio: 0.07  # 路径附近占用比例超过该值时停用路径对齐评价。
        trajectory_point_step: 4  # 每隔多少个预测轨迹点计算一次路径对齐代价。
        threshold_to_consider: 0.5  # 距目标小于该值时启用或停用对应 critic，单位米。
        offset_from_furthest: 20  # 从轨迹最远匹配点向前偏移的路径点数量。
        use_path_orientations: false  # 是否直接采用全局路径中离散姿态进行对齐。

      PathFollowCritic:  # 沿全局路径向前推进程度代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 5.0  # 当前 critic 在总轨迹代价中的权重。
        offset_from_furthest: 6  # 从轨迹最远匹配点向前偏移的路径点数量。
        threshold_to_consider: 1.2  # 距目标小于该值时启用或停用对应 critic，单位米。

      PathAngleCritic:  # 轨迹方向与路径方向差异代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 2.0  # 当前 critic 在总轨迹代价中的权重。
        offset_from_furthest: 4  # 从轨迹最远匹配点向前偏移的路径点数量。
        threshold_to_consider: 0.5  # 距目标小于该值时启用或停用对应 critic，单位米。
        max_angle_to_furthest: 1.0  # 允许轨迹朝向偏离目标路径点的最大角度，单位弧度。
        forward_preference: true  # 是否在路径角度评价中偏好向前运动。

      PreferForwardCritic:  # 惩罚倒行并偏好前向运动的代价函数参数。
        enabled: true  # 是否启用当前功能或评价项。
        cost_power: 1  # 当前 critic 原始代价使用的指数。
        cost_weight: 1.5  # 当前 critic 在总轨迹代价中的权重。
        threshold_to_consider: 0.5  # 距目标小于该值时启用或停用对应 critic，单位米。

velocity_smoother:  # 速度平滑器配置，限制速度和加速度突变。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    smoothing_frequency: 20.0  # 速度平滑器输出速度命令的频率，单位 Hz。
    scale_velocities: false  # 某一轴限幅时是否同比缩放其他速度轴。

    # Open-loop ramping lets the heavy skid-steer platform overcome motor static friction.
    feedback: OPEN_LOOP  # 速度平滑反馈模式；OPEN_LOOP 按上一条命令估算速度。
    odom_topic: /odometry/filtered  # 闭环反馈或状态参考使用的里程计话题。
    odom_duration: 0.20  # 计算里程计速度时使用的数据时间窗口，单位秒。

    # Keep the first navigation version forward-only and consistent with MPPI.
    max_velocity: [1.20, 0.0, 1.00]  # 速度平滑器的 [前向、横向、角向] 最大速度。
    min_velocity: [0.0, 0.0, -1.00]  # 速度平滑器的 [前向、横向、角向] 最小速度。

    # Acceleration limits tuned for responsive skid-steer motion.
    max_accel: [0.70, 0.0, 2.00]  # 速度平滑器的 [前向、横向、角向] 最大正加速度。
    max_decel: [-1.20, 0.0, -2.00]  # 速度平滑器的 [前向、横向、角向] 最大负加速度。

    deadband_velocity: [0.0, 0.0, 0.0]  # 小于这些值的各轴速度输出按零处理。
    velocity_timeout: 0.30  # 上游速度超时后开始输出零速的时间，单位秒。

smoother_server:  # 全局路径平滑服务器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    costmap_topic: global_costmap/costmap_raw  # 行为或平滑器读取的原始代价地图话题。
    footprint_topic: global_costmap/published_footprint  # 行为或平滑器读取的机器人 footprint 话题。
    robot_base_frame: base_footprint  # 机器人底盘参考坐标系。
    transform_tolerance: 0.30  # 允许使用的 TF 变换最大时间容差，单位秒。

    smoother_plugins:  # 路径平滑器插件列表。
      - simple_smoother  # 启用简单路径平滑器。

    simple_smoother:  # SimpleSmoother 路径平滑参数。
      plugin: "nav2_smoother::SimpleSmoother"  # 当前功能块使用的 ROS 2 插件实现。
      tolerance: 1.0e-10  # 无法精确到达时允许规划到目标附近的距离，单位米。
      max_its: 1000  # 一次路径平滑允许的最大迭代次数。
      w_data: 0.2  # 平滑后路径保持原始数据形状的权重。
      w_smooth: 0.3  # 降低路径曲率和折线程度的权重。
      do_refinement: true  # 初次平滑后是否继续执行细化。

behavior_server:  # 导航恢复行为服务器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    costmap_topic: local_costmap/costmap_raw  # 行为或平滑器读取的原始代价地图话题。
    footprint_topic: local_costmap/published_footprint  # 行为或平滑器读取的机器人 footprint 话题。
    cycle_frequency: 10.0  # 恢复行为服务器执行循环频率，单位 Hz。

    # First navigation version: do not load reverse behaviors.
    behavior_plugins:  # 允许行为树调用的恢复行为插件列表。
      - spin  # 允许原地旋转恢复。
      - wait  # 允许原地等待恢复。

    spin:  # 原地旋转恢复行为配置。
      plugin: "nav2_behaviors/Spin"  # 当前功能块使用的 ROS 2 插件实现。
    wait:  # 原地等待恢复行为配置。
      plugin: "nav2_behaviors/Wait"  # 当前功能块使用的 ROS 2 插件实现。

    global_frame: odom  # 本模块使用的全局参考坐标系。
    robot_base_frame: base_footprint  # 机器人底盘参考坐标系。
    transform_tolerance: 0.20  # 允许使用的 TF 变换最大时间容差，单位秒。
    simulate_ahead_time: 2.0  # 旋转行为向前碰撞预测的时间，单位秒。
    max_rotational_vel: 0.60  # 恢复旋转行为允许的最大角速度。
    min_rotational_vel: 0.15  # 恢复旋转行为保持运动的最小角速度。
    rotational_acc_lim: 0.60  # 恢复旋转行为允许的角加速度。

bt_navigator:  # 行为树导航器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

    global_frame: map  # 本模块使用的全局参考坐标系。
    robot_base_frame: base_footprint  # 机器人底盘参考坐标系。
    odom_topic: /odometry/filtered  # 闭环反馈或状态参考使用的里程计话题。
    bt_loop_duration: 10  # 行为树主循环周期，单位毫秒。
    default_server_timeout: 20  # 行为树动作服务默认超时时间，单位毫秒。
    wait_for_service_timeout: 1000  # 等待行为树依赖服务上线的超时时间，单位毫秒。

    # Project trees make all recovery actions forward-only.
    default_nav_to_pose_bt_xml: "/home/wheeltec/inspection_robot_ws/install/inspection_robot_navigation/share/inspection_robot_navigation/behavior_trees/navigate_to_pose_forward_only.xml"  # 单目标导航使用的行为树 XML 文件。
    default_nav_through_poses_bt_xml: "/home/wheeltec/inspection_robot_ws/install/inspection_robot_navigation/share/inspection_robot_navigation/behavior_trees/navigate_through_poses_forward_only.xml"  # 多目标导航使用的行为树 XML 文件。

    plugin_lib_names:  # 行为树运行时需要显式加载的节点插件库。
      - nav2_compute_path_to_pose_action_bt_node  # 加载或选择 `nav2_compute_path_to_pose_action_bt_node`。
      - nav2_compute_path_through_poses_action_bt_node  # 加载或选择 `nav2_compute_path_through_poses_action_bt_node`。
      - nav2_follow_path_action_bt_node  # 加载或选择 `nav2_follow_path_action_bt_node`。
      - nav2_spin_action_bt_node  # 加载或选择 `nav2_spin_action_bt_node`。
      - nav2_wait_action_bt_node  # 加载或选择 `nav2_wait_action_bt_node`。
      - nav2_clear_costmap_service_bt_node  # 加载或选择 `nav2_clear_costmap_service_bt_node`。
      - nav2_goal_updated_condition_bt_node  # 加载或选择 `nav2_goal_updated_condition_bt_node`。
      - nav2_recovery_node_bt_node  # 加载或选择 `nav2_recovery_node_bt_node`。
      - nav2_pipeline_sequence_bt_node  # 加载或选择 `nav2_pipeline_sequence_bt_node`。
      - nav2_rate_controller_bt_node  # 加载或选择 `nav2_rate_controller_bt_node`。
      - nav2_round_robin_node_bt_node  # 加载或选择 `nav2_round_robin_node_bt_node`。
      - nav2_remove_passed_goals_action_bt_node  # 加载或选择 `nav2_remove_passed_goals_action_bt_node`。

bt_navigator_navigate_to_pose_rclcpp_node:  # 单目标导航行为树客户端节点配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

bt_navigator_navigate_through_poses_rclcpp_node:  # 多目标导航行为树客户端节点配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。

waypoint_follower:  # 航点跟随服务器配置。
  ros__parameters:  # 该 ROS 2 节点的参数集合。
    use_sim_time: false  # 是否使用仿真时钟；实车必须为 false。
    loop_rate: 20  # 航点跟随器检查任务状态的循环频率，单位 Hz。
    stop_on_failure: true  # 某个航点失败时是否立即终止整个航点序列。
    waypoint_task_executor_plugin: wait_at_waypoint  # 到达每个航点后执行任务的插件名称。

    wait_at_waypoint:  # 航点到达后的等待任务参数。
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"  # 当前功能块使用的 ROS 2 插件实现。
      enabled: true  # 是否启用当前功能或评价项。
      waypoint_pause_duration: 1000  # 到达航点后等待的时长，单位毫秒。
